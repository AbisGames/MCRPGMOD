name: Focused expedition access
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pipican-expedition-access-${{ github.ref }}
  cancel-in-progress: true
jobs:
  access:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 0
            region: heartlands
          - seed: 123
            region: umbral_chasm
          - seed: 987654321
            region: shimmering_reefs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Generate required special models
        run: |
          python3 tools/worldgen/build_special_landmarks.py
          mkdir -p src/main/resources/data/pipican/structure/special
          cp tools/worldgen/output/data/pipican/structure/special/*.nbt src/main/resources/data/pipican/structure/special/
          cp tools/worldgen/output/data/pipican/structure/authored/landmarks/ashlands/morvath.nbt src/main/resources/data/pipican/structure/authored/landmarks/ashlands/morvath.nbt
      - name: Compile and package
        run: chmod +x ./gradlew && ./gradlew build --no-daemon
      - name: Surface underground and underwater entrance regressions
        timeout-minutes: 20
        uses: ./.github/actions/worldgen-suite
        with:
          suite: expeditions
          seed: ${{ matrix.seed }}
          target: ${{ matrix.region }}
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expedition-access-${{ github.sha }}-${{ matrix.region }}
          path: |
            run/logs/
            build/worldgen-logs/
            build/reports/
          if-no-files-found: warn
