name: Worldgen validation
on:
  push:
    branches: [worldgen-and-ores]
  pull_request:
    paths:
      - 'src/main/java/com/pipican/worldgen/**'
      - 'src/main/resources/data/pipican/worldgen/**'
      - 'src/main/resources/assets/pipican/**'
      - 'tools/validate_worldgen.py'
      - 'src/gametest/java/com/pipican/gametest/WorldgenTests.java'
permissions:
  contents: write
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate source catalogs
        run: python3 tools/validate_worldgen.py && python3 tools/validate_biome_assets.py
      - name: Generate special landmark NBT models
        run: |
          python3 tools/worldgen/build_special_landmarks.py
          mkdir -p src/main/resources/data/pipican/structure/special
          cp tools/worldgen/output/data/pipican/structure/special/*.nbt src/main/resources/data/pipican/structure/special/
          cp tools/worldgen/output/data/pipican/structure/authored/landmarks/ashlands/morvath.nbt src/main/resources/data/pipican/structure/authored/landmarks/ashlands/morvath.nbt
      - name: Commit generated landmark templates to branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/worldgen-and-ores'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/data/pipican/structure/special/*.nbt src/main/resources/data/pipican/structure/authored/landmarks/ashlands/morvath.nbt
          if ! git diff --cached --quiet; then
            git commit -m "assets(worldgen): check in generated special landmark NBT models"
            git push origin HEAD:worldgen-and-ores
          fi
      - name: Compile and package NeoForge mod
        run: chmod +x ./gradlew && ./gradlew build --no-daemon
      - name: NeoForge GameTest server smoke test
        timeout-minutes: 15
        run: ./gradlew runGameTestServer --no-daemon
      - name: Publish compiled singleplayer test mod
        uses: actions/upload-artifact@v4
        with:
          name: pipican-rpg-singleplayer-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
