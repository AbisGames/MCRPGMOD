name: Worldgen validation
concurrency:
  group: pipican-worldgen-validation-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      focused_only:
        description: Verify Hallvard, Skelvik and Bogmere before the full matrix
        type: boolean
        default: true
      probe_terrain:
        description: Diagnose the three terrain regressions without assembling a whole capital
        type: boolean
        default: false
  push:
    branches: [worldgen-and-ores]
  pull_request:
    paths:
      - 'src/main/java/com/pipican/worldgen/**'
      - 'src/main/resources/data/pipican/worldgen/**'
      - 'src/main/resources/assets/pipican/**'
      - 'tools/validate_worldgen.py'
      - 'src/gametest/java/com/pipican/gametest/WorldgenTests.java'
permissions:
  contents: write
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 0
            region: heartlands
            capital: hallvard
          - seed: 123
            region: aetheris_expanse
            capital: skelvik
          - seed: 987654321
            region: shimmering_reefs
            capital: bogmere
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
      - name: Validate source catalogs
        run: python3 tools/validate_worldgen.py && python3 tools/validate_biome_assets.py && python3 tools/worldgen/validate_biome_mines.py
      - name: Generate special landmark NBT models
        run: |
          python3 tools/worldgen/build_special_landmarks.py
          mkdir -p src/main/resources/data/pipican/structure/special
          cp tools/worldgen/output/data/pipican/structure/special/*.nbt src/main/resources/data/pipican/structure/special/
          cp tools/worldgen/output/data/pipican/structure/authored/landmarks/ashlands/morvath.nbt src/main/resources/data/pipican/structure/authored/landmarks/ashlands/morvath.nbt
      - name: Compile and package NeoForge mod
        run: chmod +x ./gradlew && ./gradlew build --no-daemon
      - name: Verify packaged structure templates
        id: packaged
        run: for jar in build/libs/*.jar; do python3 tools/worldgen/validate_packaged_mod.py "$jar"; done
      - name: Focused capital terrain regression
        if: ${{ !cancelled() && steps.packaged.outcome == 'success' }}
        timeout-minutes: 15
        uses: ./.github/actions/worldgen-suite
        with:
          suite: ${{ inputs.probe_terrain && 'terrain_probe' || 'capital' }}
          seed: ${{ matrix.seed }}
          target: ${{ matrix.capital }}
      - name: Focused native regional settlement regression
        id: focused
        if: ${{ !cancelled() && steps.packaged.outcome == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.focused_only) }}
        timeout-minutes: 20
        uses: ./.github/actions/worldgen-suite
        with:
          suite: villages
          seed: ${{ matrix.seed }}
          target: ${{ matrix.region }}
      - name: Generated sky islands and End portal
        if: ${{ !cancelled() && steps.packaged.outcome == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.focused_only) }}
        timeout-minutes: 15
        uses: ./.github/actions/worldgen-suite
        with:
          suite: sky
          seed: ${{ matrix.seed }}
      - name: Player protection and ore disk reload
        if: ${{ !cancelled() && steps.packaged.outcome == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.focused_only) }}
        timeout-minutes: 10
        uses: ./.github/actions/worldgen-suite
        with:
          suite: protection
          seed: ${{ matrix.seed }}
      - name: Unique landmark placement
        if: ${{ !cancelled() && steps.packaged.outcome == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.focused_only) }}
        timeout-minutes: 15
        uses: ./.github/actions/worldgen-suite
        with:
          suite: unique
          seed: ${{ matrix.seed }}
      - name: All regional capital terrain
        if: ${{ !cancelled() && steps.packaged.outcome == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.focused_only) }}
        timeout-minutes: 15
        uses: ./.github/actions/worldgen-suite
        with:
          suite: terrain
          seed: ${{ matrix.seed }}
      - name: All authored settlements and disk reload
        if: ${{ !cancelled() && steps.packaged.outcome == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.focused_only) }}
        timeout-minutes: 25
        uses: ./.github/actions/worldgen-suite
        with:
          suite: settlements
          seed: ${{ matrix.seed }}
      - name: Regional native villages and outposts
        if: ${{ !cancelled() && steps.packaged.outcome == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.focused_only) }}
        timeout-minutes: 30
        uses: ./.github/actions/worldgen-suite
        with:
          suite: villages
          seed: ${{ matrix.seed }}
      - name: All regional mine and dungeon fixtures
        if: ${{ !cancelled() && steps.packaged.outcome == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.focused_only) }}
        timeout-minutes: 45
        uses: ./.github/actions/worldgen-suite
        with:
          suite: expeditions
          seed: ${{ matrix.seed }}
      - name: All capital assemblies and road connectivity
        if: ${{ !cancelled() && steps.packaged.outcome == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.focused_only) }}
        timeout-minutes: 60
        uses: ./.github/actions/worldgen-suite
        with:
          suite: capital
          seed: ${{ matrix.seed }}
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldgen-diagnostics-${{ github.sha }}-seed-${{ matrix.seed }}
          path: |
            run/logs/
            runs/**/logs/
            build/reports/
            build/worldgen-logs/
          if-no-files-found: warn
      - name: Publish compiled singleplayer test mod
        if: matrix.seed == 0
        uses: actions/upload-artifact@v4
        with:
          name: pipican-rpg-${{ github.event_name == 'workflow_dispatch' && inputs.focused_only && 'focused' || 'full' }}-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
